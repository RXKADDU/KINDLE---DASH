name: Update Kindle dashboard

on:
  schedule:
    - cron: "5 * * * *"      # every hour at about HH:05 (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pillow requests

      - name: Restore last good data
        run: |
          mkdir -p data
          git fetch --depth 1 origin output 2>/dev/null && git show origin/output:last.json > data/last.json || echo "no previous data"

      - name: Build pages
        run: python generator/build.py

      - name: Publish to output branch
        run: |
          cp data/last.json out/last.json
          cd out
          git init -q -b output
          git config user.name "kindle-dash-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output

      - name: Keep the schedule alive
        run: |
          # GitHub pauses schedules in repos with no commits for 60 days, so touch main monthly
          LAST=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - LAST )) -gt 2160000 ]; then
            date -u > data/keepalive.txt
            git config user.name "kindle-dash-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/keepalive.txt && git commit -q -m "Keep schedule alive" && git push -q
          fi
